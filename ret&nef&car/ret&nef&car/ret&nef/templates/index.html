<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/BackGround2.jpg'); /* Adjust path relative to the 'static' folder */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1,
        p {
            text-align: center;
            color: white;
        }

        a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid white;
            transition: border-bottom 0.3s ease;
        }

        a:hover {
            border-bottom: 1px solid transparent;
        }
    </style>
</head>

<body>
    <h1>Multiple Diabetic Complication Detection</h1>
    <p>Please wait, you are being redirected...</p>

    <script>
        // Redirect to login.html after 1 second
        setTimeout(function() {
            window.location.href = "/login";
        }, 1000); // Change the delay time as needed (in milliseconds)
    </script>
</body>

</html>
